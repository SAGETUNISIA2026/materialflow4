server {
    listen 80;
    client_max_body_size 50M; 
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://fastapi_backend_v13:8000;
    }
}
