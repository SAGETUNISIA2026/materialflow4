services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db_v13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flux_db
    volumes:
      - pgdata_v13:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi_backend_v13
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

  frontend:
    build: ./frontend
    container_name: react_nginx_frontend_v13
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata_v13:
